services:
  - type: web
    name: qr-dimension-scanner-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
