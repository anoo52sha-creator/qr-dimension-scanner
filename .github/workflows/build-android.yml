name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build QR Dimension Scanner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Configure API URL & build React app
        working-directory: frontend
        env:
          SECRET_API_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -n "$SECRET_API_URL" ]; then
            echo "VITE_API_BASE_URL=$SECRET_API_URL" >> "$GITHUB_ENV"
          else
            echo "VITE_API_BASE_URL=https://qr-dimension-scanner-api.onrender.com" >> "$GITHUB_ENV"
          fi
          npm run build

      - name: Generate and sync Capacitor Android project
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/configure-android.mjs
          npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Rename APK for distribution
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/qr-dimension-scanner.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-dimension-scanner-apk
          path: dist-apk/qr-dimension-scanner.apk
          retention-days: 30
